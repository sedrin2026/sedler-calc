<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>PWAアイコン生成ツール</title>
    <style>
        body { background: #111; color: #fff; text-align: center; font-family: sans-serif; padding-top: 50px; }
        button { background: #4f46e5; color: white; border: none; padding: 14px 28px; font-size: 16px; border-radius: 8px; cursor: pointer; margin: 15px; }
        button:hover { background: #4338ca; }
    </style>
</head>
<body>
    <h1>PWA用 PNGアイコン生成</h1>
    <p>下のボタンを押すと、正しいサイズのPNGアイコンが直接ダウンロードされます！</p>
    
    <button onclick="generateIcon(192, 'icon-192.png')">icon-192.png を生成・ダウンロード</button><br>
    <button onclick="generateIcon(512, 'icon-512.png')">icon-512.png を生成・ダウンロード</button>

    <script>
        function generateIcon(size, filename) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // 背景（黒）
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, size, size);

            // アイコンのデザイン（電卓をイメージした文字や絵文字）
            ctx.font = `${size * 0.5}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🧮', size / 2, size / 2);

            // PNGファイルとしてダウンロード
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
