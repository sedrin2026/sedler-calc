<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER CALC</title>
    <!-- manifest.json の読み込み -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#000000">

    <style>
        /* 既存のスタイルを邪魔しない基本的な電卓デザインの例 */
        body {
            background: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .calculator {
            background: #222;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-align: center;
        }
        /* PWAインストールボタン用のスタイル（初期状態は非表示） */
        #install-btn {
            display: none;
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        #install-btn:hover {
            background: #4338ca;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <h1>CYBER CALC</h1>
        <p>ここに電卓の機能が入ります</p>

        <!-- ③ ④ 画面内に配置するインストールボタン（CSS付き・初期はhidden） -->
        <button id="install-btn">📲 アプリをインストール</button>
    </div>

    <!-- 既存のService Worker登録処理 -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker 登録成功:', reg.scope))
                    .catch((err) => console.log('Service Worker 登録失敗:', err));
            });
        }
    </script>

    <!-- ② PWAインストール制御用のJavaScript -->
    <script>
        // インストールプロンプトのイベントを保存する変数
        let deferredPrompt = null;
        const installBtn = document.getElementById('install-btn');

        // Android Chromeなどがインストール可能と判断した時に発火するイベント
        window.addEventListener('beforeinstallprompt', (e) => {
            // デフォルトのブラウザの自動インジケータを抑制する
            e.preventDefault();
            // イベントを後から使えるように変数に保持する
            deferredPrompt = e;
            // 画面内のインストールボタンを表示する
            installBtn.style.display = 'block';
        });

        // ユーザーがインストールボタンを押した時の処理
        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;

            // ブラウザのインストール確認ダイアログを表示する
            deferredPrompt.prompt();

            // ユーザーの選択結果（インストール or キャンセル）を待つ
            const { outcome } = await deferredPrompt.userChoice;
            console.log(`ユーザーの選択: ${outcome}`);

            // プロンプトは一度しか使えないため破棄する
            deferredPrompt = null;
            // ボタンを非同期で非表示にする
            installBtn.style.display = 'none';
        });

        // すでにインストール済みのアプリとして起動された場合の処理
        window.addEventListener('appinstalled', () => {
            console.log('アプリのインストールが完了しました！');
            deferredPrompt = null;
            installBtn.style.display = 'none';
        });
    </script>
</body>
</html>
