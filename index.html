<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>電卓アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 電卓本体のコンテナ（既存の構造に合わせて適宜配置してください） -->
    <div class="calculator-container">

        <!-- 既存の mode-slider 一式は完全に削除し、以下に置き換え -->
        <div class="mode-buttons-container">
            <div class="mode-buttons">
                <div class="button-group">
                    <button type="button" id="tax-in-btn" class="mode-btn">税込</button>
                    <select id="tax-in-select" class="rate-select" style="display: none;">
                        <option value="0.10">10%</option>
                        <option value="0.09">9%</option>
                        <option value="0.08">8%</option>
                        <option value="0.07">7%</option>
                        <option value="0.06">6%</option>
                        <option value="0.05">5%</option>
                        <option value="0.04">4%</option>
                        <option value="0.03">3%</option>
                        <option value="0.02">2%</option>
                        <option value="0.01">1%</option>
                    </select>
                </div>

                <div class="button-group">
                    <button type="button" id="tax-out-btn" class="mode-btn">税抜</button>
                    <select id="tax-out-select" class="rate-select" style="display: none;">
                        <option value="0.10">10%</option>
                        <option value="0.09">9%</option>
                        <option value="0.08">8%</option>
                        <option value="0.07">7%</option>
                        <option value="0.06">6%</option>
                        <option value="0.05">5%</option>
                        <option value="0.04">4%</option>
                        <option value="0.03">3%</option>
                        <option value="0.02">2%</option>
                        <option value="0.01">1%</option>
                    </select>
                </div>

                <div class="button-group">
                    <button type="button" id="discount-btn" class="mode-btn">割引</button>
                    <select id="discount-select" class="rate-select" style="display: none;">
                        <option value="10">10%</option>
                        <option value="20">20%</option>
                        <option value="30">30%</option>
                        <option value="40">40%</option>
                        <option value="50">50%</option>
                        <option value="60">60%</option>
                        <option value="70">70%</option>
                        <option value="80">80%</option>
                        <option value="85">85%</option>
                    </select>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
