<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レシート家計簿アプリ（Tesseract.js OCR搭載版）</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FullCalendar -->
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <!-- Tesseract.js CDN -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <div class="max-w-4xl mx-auto p-4 md:p-6">
        <header class="bg-white shadow rounded-lg p-4 mb-6 flex justify-between items-center">
            <h1 class="text-xl font-bold text-indigo-600">レシート家計簿 ＆ OCR</h1>
            <span id="status-badge" class="text-xs bg-green-100 text-green-800 px-2 py-1 rounded-full font-semibold">システム稼働中</span>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- 左側：入力・OCR読み取りエリア -->
            <div class="bg-white shadow rounded-lg p-5">
                <h2 class="text-lg font-semibold mb-4 text-gray-700">レシート撮影・アップロード</h2>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-600 mb-2">レシート画像を選択</label>
                    <input type="file" id="receipt-input" accept="image/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100"/>
                </div>

                <!-- プレースホルダー / Canvas -->
                <div id="preview-container" class="mb-4 hidden">
                    <p class="text-xs text-gray-500 mb-1">プレビュー:</p>
                    <img id="image-preview" class="max-h-48 mx-auto rounded border" alt="プレビュー">
                </div>

                <button id="process-ocr-btn" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-lg font-semibold hover:bg-indigo-700 transition duration-200 mb-4 disabled:bg-gray-300" disabled>
                    本気(ガチ)OCRで解析する
                </button>

                <div id="loading-area" class="hidden text-center py-4 text-indigo-600 font-semibold animate-pulse">
                    文字を解析中... (少々お待ちください)
                </div>

                <hr class="my-4">

                <!-- 手動・編集用フォーム -->
                <h3 class="text-md font-semibold mb-3 text-gray-700">明細データ（配列管理）</h3>
                <div class="mb-3">
                    <label class="block text-sm font-medium text-gray-600">日付</label>
                    <input type="date" id="entry-date" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                </div>

                <div id="items-container" class="space-y-2 mb-3">
                    <!-- 商品ごとの入力欄がここに動的追加されます -->
                </div>

                <button type="button" id="add-item-row" class="text-sm text-indigo-600 font-semibold hover:underline mb-4 block">+ 商品行を追加</button>

                <div class="mb-4 bg-gray-50 p-3 rounded flex justify-between items-center">
                    <span class="font-bold text-gray-700">合計金額:</span>
                    <span id="total-amount-display" class="text-xl font-bold text-indigo-600">¥0</span>
                </div>

                <button id="save-data-btn" class="w-full bg-green-600 text-white py-2 px-4 rounded-lg font-semibold hover:bg-green-700 transition duration-200">
                    家計簿に保存する
                </button>
            </div>

            <!-- 右側：カレンダー表示エリア -->
            <div class="bg-white shadow rounded-lg p-5">
                <h2 class="text-lg font-semibold mb-4 text-gray-700">カレンダー・履歴</h2>
                <div id="calendar" class="mb-6"></div>
                
                <h3 class="text-md font-semibold mb-2 text-gray-700">選択日の明細</h3>
                <div id="day-details" class="bg-gray-50 p-3 rounded min-h-[100px] text-sm text-gray-600">
                    日付を選択すると明細が表示されます。
                </div>
            </div>
        </div>
    </div>

    <script>
        let calendar;
        let savedData = JSON.parse(localStorage.getItem('kakeibo_data') || '{}');
        let selectedImageFile = null;

        document.addEventListener('DOMContentLoaded', function() {
            // 初期日付設定
            document.getElementById('entry-date').valueAsDate = new Date();
            initCalendar();
            addItemRow('', '');

            // 画像選択時の処理
            document.getElementById('receipt-input').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    selectedImageFile = file;
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        document.getElementById('image-preview').src = evt.target.result;
                        document.getElementById('preview-container').classList.remove('hidden');
                        document.getElementById('process-ocr-btn').disabled = false;
                    }
                    reader.readAsDataURL(file);
                }
            });

            // OCR実行ボタン
            document.getElementById('process-ocr-btn').addEventListener('click', function() {
                if (!selectedImageFile) return;
                runTesseractOCR(selectedImageFile);
            });

            // 行追加ボタン
            document.getElementById('add-item-row').addEventListener('click', function() {
                addItemRow('', '');
            });

            // 保存ボタン
            document.getElementById('save-data-btn').addEventListener('click', function() {
                saveKakeiboData();
            });
        });

        // 商品行を追加する関数
        function addItemRow(name, price) {
            const container = document.getElementById('items-container');
            const row = document.createElement('div');
            row.className = "flex gap-2 items-center item-row";
            row.innerHTML = `
                <input type="text" placeholder="商品名" value="${name}" class="flex-1 rounded-md border-gray-300 border p-2 text-sm item-name">
                <input type="number" placeholder="金額" value="${price}" class="w-28 rounded-md border-gray-300 border p-2 text-sm item-price" oninput="calculateTotal()">
                <button type="button" onclick="this.parentElement.remove(); calculateTotal();" class="text-red-500 font-bold px-2 py-1 hover:bg-red-50 rounded">×</button>
            `;
            container.appendChild(row);
            calculateTotal();
        }

        // 合計金額の自動計算
        function calculateTotal() {
            const prices = document.querySelectorAll('.item-price');
            let total = 0;
            prices.forEach(input => {
                const val = parseInt(input.value);
                if (!isNaN(val)) total += val;
            });
            document.getElementById('total-amount-display').textContent = '¥' + total.toLocaleString();
        }

        // Tesseract.jsによる本物OCR処理
        async function runTesseractOCR(file) {
            const loadingArea = document.getElementById('loading-area');
            const processBtn = document.getElementById('process-ocr-btn');
            loadingArea.classList.remove('hidden');
            processBtn.disabled = true;

            try {
                //日本語と英語を指定してOCR実行
                const result = await Tesseract.recognize(file, 'jpn+eng', {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            loadingArea.textContent = `文字を解析中... (${Math.round(m.progress * 100)}%)`;
                        }
                    }
                });

                const text = result.data.text;
                parseReceiptText(text);
            } catch (error) {
                console.error(error);
                alert('OCR処理中にエラーが発生しました。');
            } finally {
                loadingArea.classList.add('hidden');
                processBtn.disabled = false;
            }
        }

        // 抽出されたテキストから商品名と価格を簡易パースするロジック
        function parseReceiptText(text) {
            const lines = text.split('\n');
            document.getElementById('items-container.innerHTML') = '';
            document.getElementById('items-container').innerHTML = ''; // クリア

            let foundCount = 0;
            lines.forEach(line => {
                // 数字（価格らしきもの）が含まれている行を抽出のターゲットにする
                const matchPrice = line.match(/([1-9][0-9,]{1,5})/);
                if (matchPrice && line.length > 2) {
                    const priceStr = matchPrice[1].replace(/,/g, '');
                    const price = parseInt(priceStr);
                    // 金額らしき部分を除いた残りを商品名とする
                    const name = line.replace(matchPrice[1], '').trim() || "商品";
                    
                    if (price > 20 && price < 50000) { // 常識的な価格範囲
                        addItemRow(name, price);
                        foundCount++;
                    }
                }
            });

            if (foundCount === 0) {
                // うまくパースできなかった場合は全テキストを行として追加するか、手動入力を促す
                addItemRow("読取テキスト行", "");
            }
            calculateTotal();
        }

        // データを保存する（items配列対応）
        function saveKakeiboData() {
            const date = document.getElementById('entry-date').value;
            if (!date) {
                alert('日付を選択してください。');
                return;
            }

            const rows = document.querySelectorAll('.item-row');
            const items = [];
            let total = 0;

            rows.forEach(row => {
                const name = row.querySelector('.item-name').value;
                const price = parseInt(row.querySelector('.item-price').value) || 0;
                if (name || price > 0) {
                    items.push({ name: name, price: price });
                    total += price;
                }
            });

            if (items.length === 0) {
                alert('少なくとも1件の商品・価格を入力してください。');
                return;
            }

            savedData[date] = { items: items, total: total };
            localStorage.setItem('kakeibo_data', JSON.stringify(savedData));

            alert('家計簿に保存しました！');
            calendar.refetchEvents();
        }

        // カレンダーの初期化
        function initCalendar() {
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'ja',
                height: 380,
                events: function(fetchInfo, successCallback, failureCallback) {
                    const events = [];
                    for (const date in savedData) {
                        events.push({
                            title: '¥' + savedData[date].total.toLocaleString(),
                            start: date,
                            allDay: true,
                            backgroundColor: '#4f46e5',
                            borderColor: '#4f46e5'
                        });
                    }
                    successCallback(events);
                },
                dateClick: function(info) {
                    showDayDetails(info.dateStr);
                }
            });
            calendar.render();
        }

        // 選択日の詳細表示
        function showDayDetails(dateStr) {
            const detailsEl = document.getElementById('day-details');
            const data = savedData[dateStr];
            
            document.getElementById('entry-date').value = dateStr;

            if (!data || !data.items) {
                detailsEl.innerHTML = `<p class="font-semibold text-gray-700">${dateStr}</p><p class="text-gray-500 mt-1">データはありません。</p>`;
                return;
            }

            let html = `<p class="font-semibold text-indigo-600 mb-2">${dateStr} の明細 (合計: ¥${data.total.toLocaleString()})</p><ul class="space-y-1">`;
            data.items.forEach(item => {
                html += `<li class="flex justify-between border-b pb-1"><span>${item.name}</span><span class="font-semibold">¥${item.price.toLocaleString()}</span></li>`;
            });
            html += `</ul>`;
            detailsEl.innerHTML = html;
        }
    </script>
</body>
</html>
